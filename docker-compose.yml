# Optional: run MongoDB + API + client together with `docker compose up`
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  server:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes: ["./server:/app"]
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/kathmandu-expenses
      JWT_SECRET: change-me-in-production
      CLIENT_URL: http://localhost:5173
    depends_on: [mongo]
  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes: ["./client:/app"]
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on: [server]
volumes:
  mongo-data:
